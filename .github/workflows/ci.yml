name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd packages/engine && bun install && bun test

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd mcp && bun install
      - run: cd mcp && echo '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{}}" | timeout 5 bun run index.ts 2>/dev/null | grep -q "algo-tutor"

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n deploy/bootstrap.sh
      - run: grep -q "install.determinate.systems" deploy/bootstrap.sh
