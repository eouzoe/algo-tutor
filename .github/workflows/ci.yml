name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd packages/engine && bun test

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - run: nix profile install nixpkgs#devenv
      - run: devenv allow
      - run: devenv test

  wsl-ubuntu:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install WSL Ubuntu
        shell: powershell
        run: wsl --install -d Ubuntu --no-launch
      - name: Bootstrap and test inside WSL Ubuntu
        shell: powershell
        run: |
          wsl -d Ubuntu -- bash -c "curl -fsSL https://raw.githubusercontent.com/eouzoe/algo-tutor/main/start.sh | bash"

  wsl-nixos:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install NixOS-WSL
        shell: powershell
        run: |
          curl.exe -L -o "$env:TEMP\nixos.wsl" "https://github.com/nix-community/NixOS-WSL/releases/latest/download/nixos.wsl"
          wsl --install --from-file "$env:TEMP\nixos.wsl" --no-launch
      - name: Bootstrap and test inside WSL NixOS
        shell: powershell
        run: |
          wsl -d NixOS -- sh -lc "nix-shell -p curl git bash --command 'curl -fsSL https://raw.githubusercontent.com/eouzoe/algo-tutor/main/start.sh | bash'"
